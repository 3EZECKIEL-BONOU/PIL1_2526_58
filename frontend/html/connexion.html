<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion - IFRI MentorLink</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/connexion.css">
</head>

<body>

<nav>
    <a class="logo" href="#">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </div>

        <span class="logo-text">
            IFRI<span>Mentor</span>Link
        </span>
    </a>
</nav>

<section class="login-section">

    <div class="login-card">

        <div class="badge">CONNEXION</div>

        <h1>Bon retour parmi nous</h1>

        <p class="subtitle">
            Connectez-vous pour accéder à votre espace mentorat.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="exemple@ifri.uac.bj"
                    required>
            </div>

            <div class="input-group">
                <label>Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="********"
                    required>
            </div>

            <button type="submit" class="btn-login">
                Se connecter
            </button>

        </form>

        <div class="separator">
            <span>ou</span>
        </div>

        <p class="register-link">
            Vous n'avez pas encore de compte ?
            <a href="etuinscri.html">
                S'inscrire
            </a>
        </p>

    </div>

</section>

<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn      = form.querySelector(".btn-login");

    if (!email || !password) {
        showError("Veuillez remplir tous les champs.");
        return;
    }

    btn.disabled    = true;
    btn.textContent = "Connexion…";

    try {
        const resp = await fetch("/api/login/", {
            method : "POST",
            headers: { "Content-Type": "application/json" },
            body   : JSON.stringify({ email, password }),
        });
        const json = await resp.json();

        if (resp.ok) {
            localStorage.setItem("access_token",  json.access);
            localStorage.setItem("refresh_token", json.refresh);
            localStorage.setItem("user", JSON.stringify(json.user));

            const u = json.user;
            if (u.is_mentor) {
                window.location.href = "dashboardmentor.html";
            } else {
                window.location.href = "dashboardmentee.html";
            }
        } else {
            showError(json.error || "Email ou mot de passe incorrect.");
            btn.disabled    = false;
            btn.textContent = "Se connecter";
        }
    } catch (err) {
        showError("Erreur réseau. Réessayez.");
        btn.disabled    = false;
        btn.textContent = "Se connecter";
    }
});

function showError(msg) {
    let el = document.getElementById("login-error");
    if (!el) {
        el = document.createElement("p");
        el.id = "login-error";
        el.style.cssText = "color:#EF4444;font-size:13px;margin-top:10px;text-align:center;font-weight:600";
        form.appendChild(el);
    }
    el.textContent = msg;
}

</script>

</body>
</html>
