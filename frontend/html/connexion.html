<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI MentorLink</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="connexion.css">
</head>

<body>

<!-- NAVBAR -->
<nav>
    <a class="logo" href="index.html">
        <div class="logo-icon">👥</div>
        <span class="logo-text">
            IFRI<span>Mentor</span>Link
        </span>
    </a>
</nav>

<!-- LOGIN SECTION -->
<section class="login-section">

    <div class="login-card">

        <div class="badge">CONNEXION</div>

        <h1>Bon retour parmi nous</h1>

        <p class="subtitle">
            Connectez-vous pour accéder à votre espace mentorat.
        </p>

        <!-- FORM -->
        <form onsubmit="return false;">

            <!-- EMAIL -->
            <div class="input-group">
                <label>Email universitaire</label>
                <input type="email" id="email"
                       placeholder="exemple@ifri.uac.bj"
                       required>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password"
                       placeholder="********"
                       required>
            </div>

            <!-- ROLE -->
            <div class="input-group">
                <label>Je suis</label>
                <select id="role" required>
                    <option value="">-- Choisir un rôle --</option>
                    <option value="mentor">Mentor</option>
                    <option value="mentee">Mentoré</option>
                </select>
            </div>

            <!-- BUTTON -->
            <button type="button" class="btn-login" onclick="handleLogin()">
                Se connecter
            </button>

        </form>

        <!-- SEPARATOR -->
        <div class="separator">
            <span>ou</span>
        </div>

        <!-- REGISTER -->
        <p class="register-link">
            Vous n'avez pas encore de compte ?
            <a href="etuinscri.html">S'inscrire</a>
        </p>

    </div>

</section>

<!-- SCRIPT -->
<script>
function handleLogin() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    // Vérification simple 
    if (!email || !password || !role) {
        alert("Veuillez remplir tous les champs !");
        return;
    }

    // Sauvegarde des infos utilisateur
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userRole", role);

    // Redirection selon rôle
    if (role === "mentor") {
        window.location.href = "dashboard-mentor.html";
    } else {
        window.location.href = "dashboard-mentee.html";
    }
}
</script>

</body>
</html>
