<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI MentorLink</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="connexion.css">
</head>
<body>

<nav>
    <a class="logo" href="index.html">
        <div class="logo-icon">👥</div>
        <span class="logo-text">
            IFRI<span>Mentor</span>Link
        </span>
    </a>
</nav>

<section class="login-section">

    <div class="login-card">

        <div class="badge">CONNEXION</div>

        <h1>Bon retour parmi nous</h1>

        <p class="subtitle">
            Connectez-vous pour accéder à votre espace mentorat.
        </p>

        <form>

            <div class="input-group">
                <label>Email universitaire</label>
                <input
                    type="email"
                    placeholder="exemple@ifri.uac.bj"
                    required>
            </div>

            <div class="input-group">
                <label>Mot de passe</label>
                <input
                    type="password"
                    placeholder="********"
                    required>
            </div>

            <button type="submit" class="btn-login">
                Se connecter
            </button>

        </form>

        <div class="separator">
            <span>ou</span>
        </div>

        <p class="register-link">
            Vous n'avez pas encore de compte ?
            <a href="etuinscri.html">
                S'inscrire
            </a>
        </p>

    </div>

</section>

</body>
</html>
